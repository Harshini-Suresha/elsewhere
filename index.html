{d:'2026-10-25',t:'first scribble',tag:'scribbles',b:''},
{d:'2026-10-25',t:'you should try this',tag:'i love this',b:''},
];
const SB_URL='',SB_KEY='REMOVED_KEY';
const sb=!!(SB_URL&&SB_KEY),EM='harshinisuresha7@gmail.com';
const VK='my-corner:view',SO='my-corner:sort',SK='my-corner:session',MK='my-corner:me';
let remote=[],cur='everything',view='grid',asc=false,hint=null,sess=null,flag=false;
try{view=localStorage.getItem(VK)==='list'?'list':'grid';asc=localStorage.getItem(SO)==='old';sess=JSON.parse(localStorage.getItem(SK));flag=localStorage.getItem(MK)==='1'}catch(e){}
const put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
if(location.hash==='#me'){flag=true;put(MK,'1')}
const $=s=>document.querySelector(s);
const el=(n,c,t)=>{const e=document.createElement(n);if(c)e.className=c;if(t!=null)e.textContent=t;return e};
const sl=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const HELP={
'everything':'this is my whole corner: every song, film, book and thought i’ve put up, all in one place.',
'drive-by':'my quick hellos. little things i post when i’m just passing through, nothing serious.',
'sparkle':'tiny things that made me smile: a lyric, a line from a book, something a friend said.',
'thinking out loud':'thoughts i haven’t tidied up. whatever is rattling around in my head, unfiltered.',
'scribbles':'my first drafts. things i’ve started but haven’t shaped yet, so they’re still a bit lumpy.',
'finished':'things i’ve completed and i’m proud of, like the books i’ve read all the way through.',
'i love this':'things i love and think you should try: songs, films, anything i’d text a friend about.',
_:'a label i made up for my own posts.'};
const hd=t=>({apikey:SB_KEY,Authorization:'Bearer '+(t||SB_KEY),'Content-Type':'application/json'});
function setSess(j){sess=j&&j.access_token?{at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+j.expires_in}:null;put(SK,sess&&JSON.stringify(sess))}
async function tok(){if(!sess)return'';if(sess.exp>Date.now()/1000+60)return sess.at;try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:hd(),body:JSON.stringify({refresh_token:sess.rt})});if(!r.ok)throw 0;setSess(await r.json())}catch(e){setSess(null)}return sess?sess.at:''}
const fromRow=x=>({...x,rid:x.id,b:x.b||'',u:x.u||undefined,img:x.img||undefined,k:x.k||undefined});
async function load(){if(!sb)return;try{const r=await fetch(SB_URL+'/rest/v1/entries?select=*&order=d.desc,id.desc',{headers:hd()});if(r.ok){remote=(await r.json()).map(fromRow);render();openHash()}}catch(e){}}
function build(){$('#cart').textContent=NAME.map((n,i)=>n[1]+(i===1?' ':'')).join('')}
const ro=new ResizeObserver(es=>es.forEach(e=>place(e.target)));
function place(c){const gr=c.parentNode;c.style.gridRowEnd=gr.classList.contains('list')?'':'span '+Math.ceil(c.getBoundingClientRect().height+(parseFloat(getComputedStyle(gr).columnGap)||16))}
function render(){
const all=[...remote,...BASE].sort((a,b)=>asc?a.d.localeCompare(b.d):b.d.localeCompare(a.d));
const tags=[...TAGS,...new Set(all.map(x=>x.tag).filter(t=>!TAGS.includes(t)))];
if(cur!=='everything'&&!tags.includes(cur))cur='everything';
$('#cnt').textContent=all.length+' things in my corner';
const song=all.filter(x=>x.k==='song').reduce((a,b)=>!a||b.d>a.d?b:a,null),rp=$('#rep');rp.hidden=!song;
if(song){rp.replaceChildren(el('span','gl','𓇼'),'now on repeat: ');if(song.u){const a=el('a',null,song.t);a.href=song.u;a.target='_blank';a.rel='noopener noreferrer';rp.append(a)}else rp.append(song.t)}
const so=$('#so');so.setAttribute('aria-pressed',String(asc));so.title=asc?'oldest first':'newest first';
const fl=$('#filters');fl.replaceChildren();
['everything',...tags].forEach(t=>{
const b=el('button','chip'+(t===cur?' on':''));b.type='button';b.setAttribute('aria-pressed',String(t===cur));
const i=t==='everything'?ALL:info(t);b.title=i.w+': '+i.m;const s=el('span','sw',i.g);s.setAttribute('aria-hidden','true');s.style.setProperty('--c',i.c);s.style.setProperty('--f',i.f);
b.append(s,t,el('span','ct',String(t==='everything'?all.length:all.filter(x=>x.tag===t).length)));b.onclick=()=>{cur=t;render()};const w=el('span','cw');const q=el('button','qm','?');q.type='button';q.setAttribute('aria-label','what is '+t+'?');q.setAttribute('aria-expanded',String(hint===t));q.onclick=()=>{hint=hint===t?null:t;render()};w.append(b,q);fl.append(w)});
if(hint!==null)fl.append(el('p','hint',HELP[hint]||HELP._));
$('#tl').replaceChildren(...tags.map(t=>{const o=el('option');o.value=t;return o}));
const g=$('#grid');ro.disconnect();g.replaceChildren();
const qv=($('#q').value||'').toLowerCase().trim();
const shown=all.filter(x=>(cur==='everything'||x.tag===cur)&&(!qv||(x.t+' '+(x.b||'')+' '+x.tag).toLowerCase().includes(qv)));
if(!shown.length)g.append(el('p','empty','it’s quiet in here… for now.'));
let gp=null,gm='';
shown.forEach(x=>{
const m=x.d.slice(0,7);if(m!==gm){gm=m;g.append(el('h2','mh',MON[+m.slice(5)-1]+' '+m.slice(0,4)));gp=el('div','grid'+(view==='list'?' list':''));g.append(gp)}
const i=info(x.tag);const c=el('article','card box'+((x.img||!(x.b||x.n))?' pic':''));c.style.setProperty('--c',i.c);c.dataset.s=sl(x.t);
const rule=el('div','rule'),cg=el('span','cg',i.g);cg.setAttribute('aria-hidden','true');cg.title=i.w+': '+i.m;rule.append(cg);
const h=el('h3','h'),tb=el('button','ttl');const k=x.t.lastIndexOf(' by ');if(k>0)tb.append(el('span','tn',x.t.slice(0,k)),el('span','ta',x.t.slice(k)));else tb.append(el('span','tn',x.t));tb.type='button';tb.setAttribute('aria-expanded','false');h.append(tb);if(x.u){const a=el('a','go','↗');a.href=x.u;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','open link for '+x.t);h.append(a)}
const bd=el('div','body');(x.b||x.n||'').split(/\n+/).filter(Boolean).forEach(p=>bd.append(el('p',null,p)));
const ft=el('div','foot');ft.append(el('span',null,'logged '+fmt(x.d)));
const lk=el('button','lk','link');lk.type='button';lk.onclick=async ev=>{ev.stopPropagation();const u=location.origin+location.pathname+'#'+sl(x.t);try{if(navigator.share)await navigator.share({title:x.t,url:u});else{await navigator.clipboard.writeText(u);lk.textContent='copied';setTimeout(()=>lk.textContent='link',1200)}}catch(e){}};ft.append(lk);
if(x.rid&&sess){const r=el('button','rm','delete');r.type='button';r.onclick=async ev=>{ev.stopPropagation();if(!confirm('delete this entry?'))return;const t=await tok();if(!t)return;try{const q=await fetch(SB_URL+'/rest/v1/entries?id=eq.'+x.rid,{method:'DELETE',headers:hd(t)});if(q.ok){remote=remote.filter(y=>y.rid!==x.rid);render()}}catch(e){}};ft.append(r)}
ft.append(el('span','sq'));
if(x.img){const fg=el('img','fig');fg.src=x.img;fg.alt=x.t;fg.loading='lazy';fg.decoding='async';if(x.w){fg.width=x.w;fg.height=x.h}fg.tabIndex=0;fg.onclick=()=>zoom(x.img,x.t);fg.onkeydown=ev=>{if(ev.key==='Enter')zoom(x.img,x.t)};c.append(rule,h,fg,ft)}else c.append(rule,h,bd,ft);
c.onclick=ev=>{if(x.img||ev.target.closest('.rm,.go,.lk')||view==='list')return;const o=c.classList.toggle('open');tb.setAttribute('aria-expanded',String(o))};
gp.append(c);ro.observe(c)});
}
function setView(v){view=v;$('#vg').setAttribute('aria-pressed',String(v==='grid'));$('#vl').setAttribute('aria-pressed',String(v==='list'));put(VK,v);render()}
$('#vg').onclick=()=>setView('grid');$('#vl').onclick=()=>setView('list');
$('#so').onclick=()=>{asc=!asc;put(SO,asc?'old':'new');render()};
const f=$('#add'),lg=$('#login'),plus=$('#plus');
plus.hidden=!(sb&&flag);
const shut=()=>{f.reset();f.hidden=true;lg.hidden=true;plus.setAttribute('aria-expanded','false')};
plus.onclick=()=>{if(!f.hidden||!lg.hidden){shut();return}const p=sess?f:lg;p.hidden=false;plus.setAttribute('aria-expanded','true');p.scrollIntoView({block:'center'});p.querySelector('input').focus()};
$('#cancel').onclick=shut;$('#lcancel').onclick=shut;
lg.onsubmit=async e=>{e.preventDefault();const n=$('#lnote');n.textContent='signing in…';try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:hd(),body:JSON.stringify({email:lg.e.value.trim(),password:lg.p.value})});if(!r.ok)throw 0;setSess(await r.json());lg.reset();n.textContent='';lg.hidden=true;f.hidden=false;f.t.focus();render()}catch(x){n.textContent='that didn’t work, check your email and password'}};
function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(bl=>r(bl?{blob:bl,w:c.width,h:c.height}:null),'image/jpeg',.88)};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(file)})}
f.onsubmit=async e=>{
e.preventDefault();const bt=f.querySelector('.btn'),n=$('#fnote');bt.disabled=true;n.textContent='posting…';
try{const t=await tok();if(!t){f.hidden=true;lg.hidden=false;throw 'in'}
const o={d:new Date().toLocaleDateString('en-CA'),t:f.t.value.trim(),b:f.b.value.trim(),tag:f.g.value.trim().toLowerCase()||TAGS[0],k:f.s.checked?'song':null};
const u=f.u.value.trim();if(/^https?:\/\//i.test(u))o.u=u;
const file=f.im.files[0];if(file){const s=await shrink(file);if(s){const nm=Date.now()+'.jpg';const r=await fetch(SB_URL+'/storage/v1/object/covers/'+nm,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'image/jpeg'},body:s.blob});if(!r.ok)throw 0;o.img=SB_URL+'/storage/v1/object/public/covers/'+nm;o.w=s.w;o.h=s.h}}
const r=await fetch(SB_URL+'/rest/v1/entries',{method:'POST',headers:{...hd(t),Prefer:'return=representation'},body:JSON.stringify(o)});if(!r.ok)throw 0;
remote.unshift(fromRow((await r.json())[0]));shut();cur='everything';n.textContent='';render()}
catch(x){n.textContent=x==='in'?'':'couldn’t post, please try again'}
bt.disabled=false};
$('#ctab').onclick=()=>{$('#ctab').hidden=true;const s=$('#sub');s.hidden=false;s.querySelector('input').focus()};
$('#sub').onsubmit=async e=>{e.preventDefault();const fm=e.target,em=fm.querySelector('input').value.trim(),n=$('#subnote');n.hidden=false;
if(sb){try{const r=await fetch(SB_URL+'/rest/v1/seats',{method:'POST',headers:{...hd(),Prefer:'return=minimal'},body:JSON.stringify({email:em})});if(r.ok){n.textContent='you’re on the list! i’ll save you a seat.';fm.reset();return}}catch(x){}}
const a=el('a',null,EM);a.href='mailto:'+EM;n.replaceChildren('opening your mail app… just hit send and i’ll add you to my list. if nothing opens, write to ',a,'.');
location.href='mailto:'+EM+'?subject='+encodeURIComponent('save me a seat')+'&body='+encodeURIComponent('hi! please add me to your list: '+em);fm.reset()};
const lb=$('#lb');
function zoom(src,alt){lb.firstElementChild.src=src;lb.firstElementChild.alt=alt;lb.hidden=false}
lb.onclick=()=>{lb.hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true;if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#q').oninput=()=>render();
const root=document.documentElement,TK='my-corner:theme';
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
try{const t=localStorage.getItem(TK);if(t==='dark'||t==='light')root.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const t=isDark()?'light':'dark';root.dataset.theme=t;put(TK,t)};
function openHash(){const h=decodeURIComponent(location.hash.slice(1)).replace(/["\\]/g,'');if(!h||h==='me')return;const q=()=>document.querySelector('[data-s="'+h+'"]');let c=q();
if(!c&&(cur!=='everything'||$('#q').value)){cur='everything';$('#q').value='';render();c=q()}
if(!c)return;document.querySelectorAll('.hit').forEach(n=>n.classList.remove('hit'));c.classList.add('hit');setTimeout(()=>c.scrollIntoView({block:'center'}),350)}
addEventListener('hashchange',openHash);
build();setView(view);openHash();load();
})();
</script>
</body>
</html>
